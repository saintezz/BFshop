<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainrotFarmShop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            padding: 15px 20px;
            z-index: 100;
        }

        .logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            display: block;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <img src="LOGO" alt="BFshop Logo" class="logo">
    </div>
</body>
</html>
