<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainrotFarmShop</title>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #050505;
    --surface: #0c0c0e;
    --surface-2: #111114;
    --border: #1c1c20;
    --border-strong: #2a2a30;
    --text: #e8e8ea;
    --text-dim: #8a8a92;
    --text-faint: #55555c;
    --accent: #d4b45a;
    --accent-soft: rgba(212, 180, 90, 0.08);
    --success: #4ade80;
    --error: #f87171;
    --radius: 12px;
    --radius-lg: 18px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 180, 90, 0.06), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(212, 180, 90, 0.03), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== Шапка: логотип + счётчик справа ===== */
  .top-bar {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 18px;
    padding: 0 20px;
    line-height: 0;
  }

  .logo {
    width: 200px;
    height: 200px;
    object-fit: contain;
    display: block;
    margin-top: -70px;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }

  .header-balance {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding-bottom: 10px;
    margin-top: 10px;
  }

  .header-balance .label {
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .header-balance .value {
    color: var(--accent);
    font-size: 26px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .header-balance .value.unknown {
    color: var(--text-faint);
    font-weight: 500;
  }

  /* ===== Вкладки ===== */
  .tabs {
    position: fixed;
    top: 24px;
    right: 28px;
    display: flex;
    gap: 8px;
    z-index: 100;
  }

  .tab-btn {
    background: rgba(12, 12, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 10px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.1px;
    transition: all 0.18s ease;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tab-btn:hover { color: var(--text); border-color: var(--border-strong); }
  .tab-btn.active {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: rgba(212, 180, 90, 0.3);
  }

  /* ===== Панели ===== */
  .panel {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 240px auto 60px;
    padding: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.8);
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel h2 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .panel .subtitle { color: var(--text-dim); font-size: 13.5px; margin-bottom: 28px; }

  /* ===== Форма входа ===== */
  .login-form { display: flex; flex-direction: column; gap: 14px; max-width: 340px; }
  .field-label { color: var(--text-dim); font-size: 13px; margin-bottom: -6px; }

  .input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-family: inherit;
    transition: all 0.18s ease;
  }
  .input::placeholder { color: var(--text-faint); }
  .input:focus { outline: none; border-color: var(--accent); background: #141418; box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    background: var(--accent); color: #0a0a0a; border: none; padding: 12px 20px;
    border-radius: 10px; font-weight: 600; font-size: 14px; font-family: inherit;
    cursor: pointer; transition: opacity 0.18s ease, transform 0.1s ease; width: fit-content;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn-ghost {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 10px; font-weight: 500; font-size: 13.5px;
    font-family: inherit; cursor: pointer; transition: all 0.18s ease;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

  /* ===== Сообщения ===== */
  .msg { font-size: 13.5px; padding: 10px 14px; border-radius: 9px; border: 1px solid transparent; }
  .msg.error { color: var(--error); background: rgba(248, 113, 113, 0.06); border-color: rgba(248, 113, 113, 0.18); }
  .msg.success { color: var(--success); background: rgba(74, 222, 128, 0.06); border-color: rgba(74, 222, 128, 0.18); }

  /* ===== Админ-панель ===== */
  .admin-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .admin-header .who { color: var(--text-dim); font-size: 13.5px; }
  .admin-header .who b { color: var(--accent); font-weight: 600; }

  .admin-grid { display: flex; flex-direction: column; gap: 22px; }
  .stat-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
  .stat-box .label { color: var(--text-dim); font-size: 12.5px; letter-spacing: 0.3px; text-transform: uppercase; margin-bottom: 8px; }
  .stat-box .value { font-size: 32px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
  .stat-box .value.unknown { color: var(--text-faint); }

  .control-group { display: flex; flex-direction: column; gap: 12px; }
  .control-row { display: flex; gap: 10px; align-items: stretch; }
  .control-row .input { flex: 1; }

  .hidden { display: none !important; }

  /* ===== Модальное окно входа ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(4px);
    z-index: 1000; display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease;
  }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg);
    padding: 30px; width: 100%; max-width: 400px; transform: translateY(10px); transition: transform 0.2s ease;
  }
  .modal-overlay.active .modal { transform: translateY(0); }
  .modal h3 { margin-bottom: 20px; font-size: 18px; font-weight: 600; }

  @media (max-width: 720px) {
    .logo { width: 150px; height: 150px; margin-top: -50px; }
    .top-bar { gap: 12px; }
    .header-balance .value { font-size: 20px; }
    .header-balance .label { font-size: 11px; }
    .tabs { top: 16px; right: 16px; }
    .tab-btn { padding: 8px 13px; font-size: 12.5px; }
    .panel { margin: 200px 16px 40px; padding: 24px; }
  }

  @media (max-width: 480px) {
    .top-bar { gap: 8px; padding: 0 10px; }
    .logo { width: 120px; height: 120px; margin-top: -40px; }
    .header-balance .value { font-size: 18px; }
    .tabs { left: 16px; right: 16px; justify-content: center; }
    .control-row { flex-direction: column; }
    .btn { width: 100%; }
  }
</style>
</head>
<body>

<!-- Шапка: логотип + счётчик справа -->
<header class="top-bar">
  <img src="https://raw.githubusercontent.com/saintezz/BFshop/main/LOGO.png" alt="BrainrotFarmShop" class="logo">
  <div class="header-balance">
    <span class="label">Монет на складе</span>
    <span class="value unknown" id="headerBalance">??</span>
  </div>
</header>

<!-- Вкладки в правом верхнем углу -->
<nav class="tabs">
  <!-- Кнопка "Войти" (видна если не админ) -->
  <button class="tab-btn" id="loginBtn" onclick="openLoginModal()">Войти</button>
  
  <!-- Вкладка "Админ-панель" (видна только после входа) -->
  <button class="tab-btn hidden" id="adminTabBtn" onclick="toggleAdminPanel()">Админ-панель</button>
</nav>

<!-- ПАНЕЛЬ: АДМИН-ПАНЕЛЬ -->
<section class="panel hidden" id="panel-admin">
  <h2>Админ-панель</h2>
  <p class="subtitle">Управление балансом склада</p>

  <div class="admin-header">
    <span class="who">Вы вошли как <b id="adminName"></b></span>
    <button class="btn-ghost" onclick="doLogout()">Выйти</button>
  </div>

  <div class="admin-grid">
    <div class="stat-box">
      <div class="label">Текущий баланс на складе</div>
      <div class="value unknown" id="currentBalance">??</div>
    </div>

    <div class="control-group">
      <p class="field-label">Выставить количество монет</p>
      <div class="control-row">
        <input type="number" id="newBalance" class="input" min="0" step="1" placeholder="Введите число">
        <button class="btn" onclick="setBalance()">Сохранить</button>
      </div>
      <p class="msg success hidden" id="balanceSuccess"></p>
      <p class="msg error hidden" id="balanceError"></p>
    </div>
  </div>
</section>

<!-- МОДАЛЬНОЕ ОКНО ВХОДА -->
<div class="modal-overlay" id="loginModal">
  <div class="modal">
    <h3>Вход для администратора</h3>
    <div class="login-form">
      <p class="field-label">Ваш Telegram username</p>
      <input type="text" id="loginUsername" class="input" placeholder="@Saintezz7" autocomplete="username" spellcheck="false">
      <div class="control-row" style="margin-top: 10px;">
        <button class="btn" onclick="doLogin()">Войти</button>
        <button class="btn-ghost" onclick="closeLoginModal()">Отмена</button>
      </div>
      <p class="msg error hidden" id="loginError"></p>
    </div>
  </div>
</div>

<script>
  let isAdmin = false;

  /* ===== Инициализация ===== */
  fetch('/api/me')
    .then(r => r.json())
    .then(data => {
      isAdmin = data.isAdmin;
      updateAdminUI(data.username);
      loadBalance();
    });

  /* ===== Баланс ===== */
  function loadBalance() {
    fetch('/api/shop')
      .then(r => r.json())
      .then(data => {
        const isEmpty = data.balance === null || data.balance === undefined;

        const headerEl = document.getElementById('headerBalance');
        headerEl.textContent = isEmpty ? '??' : data.balance;
        headerEl.classList.toggle('unknown', isEmpty);

        const adminEl = document.getElementById('currentBalance');
        if (adminEl) {
          adminEl.textContent = isEmpty ? '??' : data.balance;
          adminEl.classList.toggle('unknown', isEmpty);
        }
      });
  }
  loadBalance();

  /* ===== Модальное окно ===== */
  function openLoginModal() {
    document.getElementById('loginModal').classList.add('active');
    document.getElementById('loginUsername').focus();
    document.getElementById('loginError').classList.add('hidden');
  }

  function closeLoginModal() {
    document.getElementById('loginModal').classList.remove('active');
    document.getElementById('loginUsername').value = '';
  }

  /* ===== UI админа ===== */
  function updateAdminUI(username) {
    const loginBtn = document.getElementById('loginBtn');
    const tabBtn   = document.getElementById('adminTabBtn');

    if (isAdmin) {
      loginBtn.classList.add('hidden');
      tabBtn.classList.remove('hidden');
      document.getElementById('adminName').textContent = '@' + (username || 'Saintezz7');
    } else {
      loginBtn.classList.remove('hidden');
      tabBtn.classList.add('hidden');
    }
  }

  /* ===== Показ панели админа ===== */
  function toggleAdminPanel() {
    const panel = document.getElementById('panel-admin');
    const tabBtn = document.getElementById('adminTabBtn');
    
    if (panel.classList.contains('hidden')) {
      panel.classList.remove('hidden');
      tabBtn.classList.add('active');
      loadBalance();
    } else {
      panel.classList.add('hidden');
      tabBtn.classList.remove('active');
    }
  }

  /* ===== Вход ===== */
  async function doLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username }),
    });
    const data = await res.json();

    if (data.ok) {
      isAdmin = true;
      updateAdminUI(username);
      closeLoginModal();
      loadBalance();
      // Автоматически открываем панель после входа
      document.getElementById('panel-admin').classList.remove('hidden');
      document.getElementById('adminTabBtn').classList.add('active');
    } else {
      errEl.textContent = data.error || 'Ошибка входа';
      errEl.classList.remove('hidden');
    }
  }

  /* ===== Выход ===== */
  async function doLogout() {
    await fetch('/api/logout');
    isAdmin = false;
    updateAdminUI(null);
    document.getElementById('panel-admin').classList.add('hidden');
    document.getElementById('adminTabBtn').classList.remove('active');
    loadBalance();
  }

  /* ===== Установка баланса ===== */
  async function setBalance() {
    const input = document.getElementById('newBalance');
    const okEl  = document.getElementById('balanceSuccess');
    const errEl = document.getElementById('balanceError');

    okEl.classList.add('hidden');
    errEl.classList.add('hidden');

    const value = Number(input.value);
    if (!Number.isFinite(value) || value < 0) {
      errEl.textContent = 'Введите неотрицательное число';
      errEl.classList.remove('hidden');
      return;
    }

    const res = await fetch('/api/set-balance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ balance: value }),
    });
    const data = await res.json();

    if (data.ok) {
      okEl.textContent = `Баланс обновлён: ${data.balance}`;
      okEl.classList.remove('hidden');
      input.value = '';
      loadBalance();
    } else {
      errEl.textContent = data.error || 'Ошибка';
      errEl.classList.remove('hidden');
    }
  }
</script>
</body>
</html>
