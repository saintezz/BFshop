<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BrainrotFarmShop</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: rgba(20, 20, 24, 0.6);
    --border: rgba(255, 255, 255, 0.08);
    --text: #ffffff;
    --text-dim: #8a8a92;
    --accent: #d4b45a;
    --accent-glow: rgba(212, 180, 90, 0.3);
    --success: #4ade80;
    --error: #f87171;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--bg);
    background-image: 
      radial-gradient(circle at 50% 0%, rgba(212, 180, 90, 0.1) 0%, transparent 50%),
      linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
    background-size: 100% 100%, 40px 40px, 40px 40px;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ===== Главный экран ===== */
  .main-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    width: 100%;
    padding: 20px;
    animation: fadeIn 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .logo-wrapper {
    position: relative;
    margin-bottom: 40px;
    animation: float 6s ease-in-out infinite;
  }

  .logo-wrapper::before {
    content: '';
    position: absolute;
    inset: -20px;
    background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
    filter: blur(20px);
    z-index: -1;
  }

  .logo-main {
    width: 280px;
    height: 280px;
    object-fit: contain;
    filter: drop-shadow(0 0 30px rgba(212, 180, 90, 0.2));
  }

  /* ===== Баланс ===== */
  .balance-card {
    background: var(--surface);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 24px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
    transition: transform 0.3s ease;
  }

  .balance-card:hover {
    transform: translateY(-5px);
  }

  .balance-label {
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-dim);
  }

  .balance-value-row {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .balance-value {
    font-family: 'Unbounded', sans-serif;
    font-size: 64px;
    font-weight: 700;
    line-height: 1;
    color: var(--accent);
    text-shadow: 0 0 20px var(--accent-glow);
    transition: all 0.3s ease;
  }

  .coin-icon {
    width: 56px;
    height: 56px;
    object-fit: contain;
    animation: spinCoin 8s linear infinite;
  }

  /* ===== Кнопка Админ-панели (Снизу по центру) ===== */
  .admin-fab-bottom {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    backdrop-filter: blur(20px);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 16px 32px;
    border-radius: 16px;
    font-family: 'Unbounded', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }

  .admin-fab-bottom:hover {
    transform: translateX(-50%) translateY(-4px);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 15px 40px var(--accent-glow);
  }

  /* ===== Модальное окно ===== */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 20px;
  }

  .modal-overlay.active {
    opacity: 1; pointer-events: auto;
  }

  .modal {
    background: #0c0c0e;
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 40px;
    width: 100%;
    max-width: 500px;
    transform: translateY(20px) scale(0.95);
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 40px 80px rgba(0,0,0,0.8);
  }

  .modal-overlay.active .modal {
    transform: translateY(0) scale(1);
  }

  .modal-title {
    font-family: 'Unbounded', sans-serif;
    font-size: 24px;
    margin-bottom: 30px;
    color: var(--text);
  }

  .form-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .input-wrapper {
    position: relative;
  }

  .input {
    width: 100%;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 20px 24px;
    border-radius: 16px;
    font-size: 18px;
    font-family: 'Inter', sans-serif;
    transition: all 0.3s ease;
  }

  .input:focus {
    outline: none;
    border-color: var(--accent);
    background: rgba(212, 180, 90, 0.05);
    box-shadow: 0 0 0 4px var(--accent-glow);
  }

  .btn-primary {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 20px;
    border-radius: 16px;
    font-family: 'Unbounded', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-primary:hover {
    background: #e5c76b;
    transform: translateY(-2px);
  }

  .btn-ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 12px 24px;
    border-radius: 12px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    cursor: pointer;
    transition: all 0.3s ease;
    width: 100%;
    margin-top: 10px;
  }

  .btn-ghost:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  .msg {
    font-size: 14px;
    padding: 14px;
    border-radius: 12px;
    text-align: center;
  }
  .msg.success { background: rgba(74, 222, 128, 0.1); color: var(--success); }
  .msg.error { background: rgba(248, 113, 113, 0.1); color: var(--error); }

  .hidden { display: none !important; }

  /* ===== Анимации ===== */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  @keyframes spinCoin {
    0% { transform: rotateY(0deg); }
    100% { transform: rotateY(360deg); }
  }

  /* ===== Адаптив ===== */
  @media (max-width: 600px) {
    .logo-main { width: 200px; height: 200px; }
    .balance-value { font-size: 48px; }
    .coin-icon { width: 40px; height: 40px; }
    .balance-card { padding: 20px 30px; width: 100%; max-width: 350px; }
    .modal { padding: 24px; }
    .admin-fab-bottom { bottom: 20px; padding: 14px 24px; white-space: nowrap; }
  }
</style>
</head>
<body>

<!-- ГЛАВНЫЙ ЭКРАН -->
<main class="main-screen">
  <div class="logo-wrapper">
    <img src="https://raw.githubusercontent.com/saintezz/BFshop/main/LOGO.png" alt="BrainrotFarmShop" class="logo-main">
  </div>

  <div class="balance-card">
    <span class="balance-label">Монет на складе</span>
    <div class="balance-value-row">
      <span class="balance-value" id="headerBalance">0</span>
      <img src="https://raw.githubusercontent.com/saintezz/BFshop/main/coin.png" alt="coin" class="coin-icon">
    </div>
  </div>
</main>

<!-- Кнопка вызова админки снизу по центру -->
<button class="admin-fab-bottom" id="adminFab" onclick="openAdminModal()">
  Админ-панель
</button>

<!-- МОДАЛЬНОЕ ОКНО -->
<div class="modal-overlay" id="adminModal">
  <div class="modal">
    <h2 class="modal-title" id="modalTitle">Вход в админ-панель</h2>

    <!-- Экран ввода пароля -->
    <div class="form-group" id="loginStep">
      <input type="password" id="adminPassword" class="input" placeholder="Введите пароль" autocomplete="off">
      <div class="msg error hidden" id="loginError">Неверный пароль</div>
      <button class="btn-primary" onclick="checkPassword()">Войти</button>
      <button class="btn-ghost" onclick="closeAdminModal()">Отмена</button>
    </div>

    <!-- Экран управления (открывается после ввода пароля) -->
    <div class="form-group hidden" id="adminStep">
      <label style="color: var(--text-dim); font-size: 14px;">Новое количество монет на складе</label>
      <input type="number" id="newBalance" class="input" min="0" step="1" placeholder="Например: 1000">
      <div class="msg success hidden" id="balanceSuccess">Баланс успешно обновлен!</div>
      <div class="msg error hidden" id="balanceError">Ошибка</div>
      <button class="btn-primary" onclick="setBalance()">Сохранить изменения</button>
      <button class="btn-ghost" onclick="closeAdminModal()">Закрыть</button>
    </div>
  </div>
</div>

<script>
  // Инициализация Telegram (чтобы на весь экран разворачивалось)
  if (window.Telegram?.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  // Загрузка баланса
  function loadBalance() {
    fetch('/api/shop')
      .then(r => r.json())
      .then(data => {
        const balance = (data.balance === null || data.balance === undefined) ? 0 : data.balance;
        const el = document.getElementById('headerBalance');
        
        if (el.textContent !== String(balance)) {
          el.style.transform = 'scale(1.1)';
          el.style.color = '#fff';
          setTimeout(() => {
            el.textContent = balance;
            el.style.transform = 'scale(1)';
            el.style.color = 'var(--accent)';
          }, 150);
        } else {
          el.textContent = balance;
        }
      });
  }

  function openAdminModal() {
    document.getElementById('adminModal').classList.add('active');
    // Сбрасываем экраны при открытии
    document.getElementById('loginStep').classList.remove('hidden');
    document.getElementById('adminStep').classList.add('hidden');
    document.getElementById('modalTitle').textContent = 'Вход в админ-панель';
    document.getElementById('adminPassword').value = '';
    document.getElementById('loginError').classList.add('hidden');
  }

  function closeAdminModal() {
    document.getElementById('adminModal').classList.remove('active');
  }

  // Проверка пароля
  async function checkPassword() {
    const pass = document.getElementById('adminPassword').value;
    const errEl = document.getElementById('loginError');
    errEl.classList.add('hidden');

    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pass }),
    });
    const data = await res.json();

    if (data.ok) {
      // Успех — переключаем экраны
      document.getElementById('loginStep').classList.add('hidden');
      document.getElementById('adminStep').classList.remove('hidden');
      document.getElementById('modalTitle').textContent = 'Управление складом';
      document.getElementById('newBalance').value = document.getElementById('headerBalance').textContent;
    } else {
      errEl.classList.remove('hidden');
    }
  }

  // Сохранение баланса
  async function setBalance() {
    const input = document.getElementById('newBalance');
    const okEl  = document.getElementById('balanceSuccess');
    const errEl = document.getElementById('balanceError');
    const pass  = document.getElementById('adminPassword').value;

    okEl.classList.add('hidden');
    errEl.classList.add('hidden');

    const value = Number(input.value);
    if (!Number.isFinite(value) || value < 0) {
      errEl.textContent = 'Введите корректное число';
      errEl.classList.remove('hidden');
      return;
    }

    const res = await fetch('/api/set-balance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ balance: value, password: pass }),
    });
    const data = await res.json();

    if (data.ok) {
      okEl.classList.remove('hidden');
      loadBalance();
      setTimeout(closeAdminModal, 1500);
    } else {
      errEl.textContent = data.error || 'Ошибка';
      errEl.classList.remove('hidden');
    }
  }

  // Запуск
  loadBalance();
</script>
</body>
</html>
