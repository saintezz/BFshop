<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrainrotFarmShop</title>
<!-- Подключаем скрипт Telegram WebApp -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --bg: #050505;
    --surface: #0c0c0e;
    --surface-2: #111114;
    --border: #1c1c20;
    --border-strong: #2a2a30;
    --text: #e8e8ea;
    --text-dim: #8a8a92;
    --text-faint: #55555c;
    --accent: #d4b45a;
    --accent-soft: rgba(212, 180, 90, 0.08);
    --success: #4ade80;
    --error: #f87171;
    --radius: 12px;
    --radius-lg: 18px;
  }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(212, 180, 90, 0.06), transparent 60%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(212, 180, 90, 0.03), transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  /* ===== Шапка: ЛЕВЫЙ ВЕРХНИЙ УГОЛ ===== */
  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 15px 20px;
    line-height: 0;
  }

  .logo {
    width: 120px;
    height: 120px;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 8px 24px rgba(0,0,0,0.6));
  }

  .header-balance {
    display: flex;
    flex-direction: column;
    gap: 0px;
    padding-bottom: 0;
  }

  .header-balance .label {
    color: var(--text-dim);
    font-size: 11px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .header-balance .value-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .header-balance .value {
    color: var(--accent);
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1.1;
  }

  .coin-icon {
    width: 24px; /* Сделали чуть меньше */
    height: 24px;
    object-fit: contain;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
  }

  /* ===== Вкладка Админа (ПРАВЫЙ НИЖНИЙ УГОЛ) ===== */
  .admin-tab-bottom {
    position: fixed;
    bottom: 24px;
    right: 28px;
    z-index: 100;
    background: rgba(12, 12, 14, 0.72);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    color: var(--text-dim);
    padding: 12px 24px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    font-family: inherit;
    letter-spacing: 0.1px;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .admin-tab-bottom:hover { color: var(--text); border-color: var(--border-strong); }
  .admin-tab-bottom.active {
    color: var(--accent);
    background: var(--accent-soft);
    border-color: rgba(212, 180, 90, 0.3);
  }

  /* ===== Панели ===== */
  .panel {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 120px auto 100px;
    padding: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.8);
    animation: fadeIn 0.35s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .panel h2 { font-size: 20px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .panel .subtitle { color: var(--text-dim); font-size: 13.5px; margin-bottom: 28px; }

  .input {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    font-family: inherit;
    transition: all 0.18s ease;
  }
  .input::placeholder { color: var(--text-faint); }
  .input:focus { outline: none; border-color: var(--accent); background: #141418; box-shadow: 0 0 0 3px var(--accent-soft); }

  .btn {
    background: var(--accent); color: #0a0a0a; border: none; padding: 12px 20px;
    border-radius: 10px; font-weight: 600; font-size: 14px; font-family: inherit;
    cursor: pointer; transition: opacity 0.18s ease, transform 0.1s ease; width: fit-content;
  }
  .btn:hover { opacity: 0.9; }
  .btn:active { transform: scale(0.98); }
  .btn-ghost {
    background: transparent; color: var(--text-dim); border: 1px solid var(--border);
    padding: 10px 18px; border-radius: 10px; font-weight: 500; font-size: 13.5px;
    font-family: inherit; cursor: pointer; transition: all 0.18s ease;
  }
  .btn-ghost:hover { color: var(--text); border-color: var(--border-strong); }

  .msg { font-size: 13.5px; padding: 10px 14px; border-radius: 9px; border: 1px solid transparent; }
  .msg.error { color: var(--error); background: rgba(248, 113, 113, 0.06); border-color: rgba(248, 113, 113, 0.18); }
  .msg.success { color: var(--success); background: rgba(74, 222, 128, 0.06); border-color: rgba(74, 222, 128, 0.18); }

  .admin-header { display: flex; align-items: center; justify-content: space-between; padding-bottom: 20px; margin-bottom: 24px; border-bottom: 1px solid var(--border); }
  .admin-header .who { color: var(--text-dim); font-size: 13.5px; }
  .admin-header .who b { color: var(--accent); font-weight: 600; }

  .admin-grid { display: flex; flex-direction: column; gap: 22px; }
  .stat-box { background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px 22px; }
  .stat-box .label { color: var(--text-dim); font-size: 12.5px; letter-spacing: 0.3px; text-transform: uppercase; margin-bottom: 8px; }
  .stat-box .value { font-size: 32px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }

  .control-group { display: flex; flex-direction: column; gap: 12px; }
  .control-row { display: flex; gap: 10px; align-items: stretch; }
  .control-row .input { flex: 1; }

  .hidden { display: none !important; }

  @media (max-width: 720px) {
    .logo { width: 90px; height: 90px; }
    .header-balance .value { font-size: 18px; }
    .coin-icon { width: 20px; height: 20px; }
    .header-balance .label { font-size: 10px; }
    .top-bar { padding: 10px; gap: 8px; }
    .admin-tab-bottom { bottom: 16px; right: 16px; padding: 10px 16px; font-size: 13px; }
    .panel { margin: 100px 16px 100px; padding: 24px; }
  }
</style>
</head>
<body>

<!-- Левый верхний угол: Лого + Баланс -->
<header class="top-bar">
  <img src="https://raw.githubusercontent.com/saintezz/BFshop/main/LOGO.png" alt="BrainrotFarmShop" class="logo">
  <div class="header-balance">
    <span class="label">Монет на складе</span>
    <div class="value-row">
      <span class="value" id="headerBalance">0</span>
      <img src="https://raw.githubusercontent.com/saintezz/BFshop/main/coin.png" alt="coin" class="coin-icon">
    </div>
  </div>
</header>

<!-- ПАНЕЛЬ: АДМИН-ПАНЕЛЬ (скрыта по умолчанию) -->
<section class="panel hidden" id="panel-admin">
  <h2>Админ-панель</h2>
  <p class="subtitle">Управление балансом склада</p>

  <div class="admin-header">
    <span class="who">Вы вошли как <b id="adminName"></b></span>
    <button class="btn-ghost" onclick="doLogout()">Выйти</button>
  </div>

  <div class="admin-grid">
    <div class="stat-box">
      <div class="label">Текущий баланс на складе</div>
      <div class="value" id="currentBalance">0</div>
    </div>

    <div class="control-group">
      <p class="field-label">Выставить количество монет</p>
      <div class="control-row">
        <input type="number" id="newBalance" class="input" min="0" step="1" placeholder="Введите число">
        <button class="btn" onclick="setBalance()">Сохранить</button>
      </div>
      <p class="msg success hidden" id="balanceSuccess"></p>
      <p class="msg error hidden" id="balanceError"></p>
    </div>
  </div>
</section>

<!-- Кнопка Админ-панели (Правый нижний угол, появляется только у админа) -->
<button class="admin-tab-bottom hidden" id="adminTabBtn" onclick="toggleAdminPanel()">
  Админ-панель
</button>

<script>
  let isAdmin = false;

  /* ===== Инициализация ===== */
  async function init() {
    // 1. Инициализируем Telegram WebApp
    const tg = window.Telegram?.WebApp;
    let initData = "";

    if (tg) {
      tg.ready();
      tg.expand(); // Разворачиваем на весь экран
      initData = tg.initData; // Получаем подписанные данные пользователя
    }

    // 2. Проверяем админа на сервере
    try {
      const res = await fetch('/api/me', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ initData }),
      });
      const data = await res.json();
      
      isAdmin = data.isAdmin;
      
      if (isAdmin) {
        // Если админ — показываем кнопку в правом нижнем углу
        document.getElementById('adminTabBtn').classList.remove('hidden');
        document.getElementById('adminName').textContent = '@' + data.username;
      }
    } catch (e) {
      console.error("Ошибка проверки админа:", e);
    }

    // 3. Загружаем баланс
    loadBalance();
  }

  /* ===== Загрузка баланса ===== */
  function loadBalance() {
    fetch('/api/shop')
      .then(r => r.json())
      .then(data => {
        const balance = (data.balance === null || data.balance === undefined) ? 0 : data.balance;

        document.getElementById('headerBalance').textContent = balance;
        const adminEl = document.getElementById('currentBalance');
        if (adminEl) adminEl.textContent = balance;
      });
  }

  /* ===== Открыть/Закрыть админку ===== */
  function toggleAdminPanel() {
    const panel = document.getElementById('panel-admin');
    const tabBtn = document.getElementById('adminTabBtn');
    
    if (panel.classList.contains('hidden')) {
      panel.classList.remove('hidden');
      tabBtn.classList.add('active');
      loadBalance();
    } else {
      panel.classList.add('hidden');
      tabBtn.classList.remove('active');
    }
  }

  /* ===== Выход ===== */
  async function doLogout() {
    await fetch('/api/logout', { method: 'POST' });
    isAdmin = false;
    document.getElementById('panel-admin').classList.add('hidden');
    document.getElementById('adminTabBtn').classList.add('hidden');
    document.getElementById('adminTabBtn').classList.remove('active');
    loadBalance();
  }

  /* ===== Установка баланса ===== */
  async function setBalance() {
    const input = document.getElementById('newBalance');
    const okEl  = document.getElementById('balanceSuccess');
    const errEl = document.getElementById('balanceError');

    okEl.classList.add('hidden');
    errEl.classList.add('hidden');

    const value = Number(input.value);
    if (!Number.isFinite(value) || value < 0) {
      errEl.textContent = 'Введите неотрицательное число';
      errEl.classList.remove('hidden');
      return;
    }

    const res = await fetch('/api/set-balance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ balance: value }),
    });
    const data = await res.json();

    if (data.ok) {
      okEl.textContent = `Баланс обновлён: ${data.balance}`;
      okEl.classList.remove('hidden');
      input.value = '';
      loadBalance();
    } else {
      errEl.textContent = data.error || 'Ошибка';
      errEl.classList.remove('hidden');
    }
  }

  // Запуск
  init();
</script>
</body>
</html>
