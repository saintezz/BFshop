<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BrainrotFarmShop</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000000;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            padding: 0;
            z-index: 100;
            line-height: 0;
            overflow: hidden;      /* обрезает логотип по краю контейнера */
            width: 180px;
            height: 160px;         /* меньше высоты логотипа → верх обрезается */
        }

        .logo {
            width: 180px;
            height: 180px;
            object-fit: contain;
            display: block;
            vertical-align: top;
            margin-top: -20px;     /* сдвигаем вверх → налезает на край */
        }

        .logo-fallback {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111111;
            border: 1px dashed #333333;
            color: #666666;
            font-size: 13px;
            text-align: center;
            line-height: 1.3;
            margin-top: -20px;
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <img src="https://raw.githubusercontent.com/saintezz/BFshop/main/LOGO.png"
             alt="BFshop Logo" class="logo"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="logo-fallback" style="display:none;">LOGO<br>не загрузился</div>
    </div>
</body>
</html>
